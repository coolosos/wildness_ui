name: Release

on:
  push:
    tags:
      - "*-*"
env:
  FLUTTER_VERSION: 3.47.2
  MELOS_VERSION: 8.6.0
  RUNID: ${{ github.run_number }}
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    permissions:
      id-token: write 
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if ! echo "$TAG" | grep -E '^[a-zA-Z_][a-zA-Z0-9_]*-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9\.-]+)?$'; then
            echo "Invalid tag format"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: 🎯 Setup flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Extract package from tag
        id: pkg
        run: |
          PACKAGE="${TAG%%-[0-9]*}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Publishing package: $PACKAGE from tag $TAG"

      - name: Melos action
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: ${{ env.MELOS_VERSION }}
          run-bootstrap: false

      - name: Publish package
        run: melos publish --no-dry-run -y --scope "${{ steps.pkg.outputs.package }}"
