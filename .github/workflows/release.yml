name: Release

on:
  push:
    tags:
      - "*-*"

jobs:
  prepare:
    name: Extract Package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.pkg.outputs.package }}
      working-directory: packages/${{ steps.pkg.outputs.package }}
    steps:
      - name: Validate and extract package from tag
        id: pkg
        run: |
          TAG="${{ github.ref_name }}"
          if ! echo "$TAG" | grep -E '^[a-zA-Z_][a-zA-Z0-9_]*-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9\.-]+)?$'; then
            echo "Invalid tag format: $TAG"
            exit 1
          fi
          PACKAGE="${TAG%%-[0-9]*}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Detected package: $PACKAGE from tag: $TAG"

  publish:
    name: Publish to pub.dev
    needs: prepare
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ needs.prepare.outputs.package }}
